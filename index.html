<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Fate Generator</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --border: 4px solid #000000;
            --radius: 0px; /* Sharp corners for brutalist look */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Monospace for terminal vibe */
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            border: var(--border);
            padding: 40px;
            position: relative;
            background: white;
            box-shadow: 12px 12px 0px #000000; /* Hard shadow */
            transition: all 0.3s ease;
        }

        h1 {
            text-transform: uppercase;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: var(--border);
            padding-bottom: 15px;
            font-size: 1.8rem;
            letter-spacing: -2px;
            line-height: 1.2;
        }

        /* Input Section */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: var(--border);
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            color: var(--fg);
            border-radius: 0;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            background: #eeeeee;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 18px;
            background: var(--fg);
            color: var(--bg);
            border: 4px solid #000; /* Matching border thickness */
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            letter-spacing: 1px;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--fg);
            border: var(--border);
        }
        
        .btn-outline:hover {
            background: #000;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        /* Game Area */
        #gameArea {
            display: none;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .score-name {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .score-num {
            font-size: 3rem;
            font-weight: 900;
        }

        .vs-text {
            font-style: italic;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .result-display {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px dashed #000;
            padding: 10px;
        }

        #resultText {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .winner-announce {
            animation: blink 0.5s step-end infinite alternate;
        }

        @keyframes blink {
            0% { background-color: white; color: black; }
            100% { background-color: black; color: white; }
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        .mode-badge {
            background: black;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            position: absolute;
            top: -4px;
            left: -4px;
            border: 2px solid white; /* contrast against container border */
        }
        
        .extension-message {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        
        .entropy-status {
            font-size: 0.6rem;
            text-align: right;
            margin-top: 5px;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="mode-badge" id="modeBadge">SUDDEN DEATH</div>
        <h1>Decision Engine</h1>

        <!-- Setup Screen -->
        <div id="setupScreen">
            <div class="input-group">
                <label>Option A</label>
                <input type="text" id="inputA" placeholder="" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Option B</label>
                <input type="text" id="inputB" placeholder="" autocomplete="off">
            </div>
            <button class="btn" onclick="initializeGame()">INITIATE SEQUENCE</button>
        </div>

        <!-- Game Screen -->
        <div id="gameArea">
            <div class="scoreboard">
                <div class="score-box">
                    <span class="score-name" id="nameDisplayA">A</span>
                    <span class="score-num" id="scoreDisplayA">0</span>
                </div>
                <div class="vs-text">VS</div>
                <div class="score-box">
                    <span class="score-name" id="nameDisplayB">B</span>
                    <span class="score-num" id="scoreDisplayB">0</span>
                </div>
            </div>

            <div class="result-display" id="resultBox">
                <p id="resultText">READY</p>
            </div>
            
            <div class="entropy-status">ALGORITHM: CRYPTO_SHUFFLE_256</div>

            <!-- Controls during game -->
            <button class="btn" id="nextRoundBtn" onclick="playRound()">CALCULATE FATE</button>
            
            <!-- Go Again Button -->
            <button class="btn" id="goAgainBtn" onclick="restartSeries()" style="display: none;">GO AGAIN</button>
            
            <!-- Series Options (Best of 3/5) -->
            <div id="seriesOptions" class="hidden">
                <span class="extension-message">EXTEND SERIES?</span>
                <div class="btn-group">
                    <button class="btn btn-outline" onclick="extendSeries(3)">Best of 3</button>
                    <button class="btn btn-outline" onclick="extendSeries(5)">Best of 5</button>
                </div>
            </div>

            <button class="btn btn-outline" style="margin-top: 30px; border-width: 2px; font-size: 0.8rem; padding: 10px;" onclick="resetGame()">RESET SYSTEM</button>
        </div>
    </div>

    <script>
        // State Variables
        let scenarioA = "";
        let scenarioB = "";
        let scoreA = 0;
        let scoreB = 0;
        let targetScore = 1; // Default is single win (Sudden Death)
        let gameActive = false;

        // DOM Elements
        const setupScreen = document.getElementById('setupScreen');
        const gameArea = document.getElementById('gameArea');
        const inputA = document.getElementById('inputA');
        const inputB = document.getElementById('inputB');
        const nameDisplayA = document.getElementById('nameDisplayA');
        const nameDisplayB = document.getElementById('nameDisplayB');
        const scoreDisplayA = document.getElementById('scoreDisplayA');
        const scoreDisplayB = document.getElementById('scoreDisplayB');
        const resultText = document.getElementById('resultText');
        const resultBox = document.getElementById('resultBox');
        const seriesOptions = document.getElementById('seriesOptions');
        const nextRoundBtn = document.getElementById('nextRoundBtn');
        const modeBadge = document.getElementById('modeBadge');
        const goAgainBtn = document.getElementById('goAgainBtn');

        function initializeGame() {
            if (!inputA.value.trim() || !inputB.value.trim()) {
                inputA.placeholder = "REQUIRED";
                inputB.placeholder = "REQUIRED";
                return;
            }

            scenarioA = inputA.value.toUpperCase();
            scenarioB = inputB.value.toUpperCase();
            
            // UI Transition
            setupScreen.classList.add('hidden');
            gameArea.style.display = 'block';
            
            nameDisplayA.innerText = scenarioA;
            nameDisplayB.innerText = scenarioB;
            
            gameActive = true;
            playRound(); // Auto-start the first flip
        }

        function playRound() {
            if (!gameActive) return;

            // Prepare UI for "Rolling"
            nextRoundBtn.disabled = true;
            nextRoundBtn.style.opacity = "0.5";
            seriesOptions.classList.add('hidden'); 
            resultBox.classList.remove('winner-announce');
            
            let iterations = 0;
            let maxIterations = 20;
            let speed = 50;
            
            // The Rolling Animation Loop
            const interval = setInterval(() => {
                // Toggle between A and B purely for visual effect
                resultText.innerText = Math.random() > 0.5 ? scenarioA : scenarioB;
                iterations++;

                if (iterations >= maxIterations) { 
                    clearInterval(interval);
                    determineWinner();
                }
            }, speed);
        }

        /**
         * The Fisher-Yates Shuffle Logic
         * Uses Cryptographically Secure Pseudo-Random Number Generator (CSPRNG)
         * This removes the bias inherent in simple Math.random()
         */
        function determineWinner() {
            // 1. Create a "deck" representing equal chances. 
            // We use a larger pool to allow for thorough shuffling.
            const poolSize = 1000;
            let fateDeck = [];
            
            // Fill deck exactly 50/50
            for (let i = 0; i < poolSize; i++) {
                if (i < poolSize / 2) {
                    fateDeck.push('A');
                } else {
                    fateDeck.push('B');
                }
            }

            // 2. Fisher-Yates Shuffle using Crypto API
            // This is the "Highest Level" standard for unbiased shuffling
            const randomBuffer = new Uint32Array(poolSize);
            window.crypto.getRandomValues(randomBuffer);

            for (let i = poolSize - 1; i > 0; i--) {
                // Get a truly random index based on our crypto buffer
                // We use the buffer value modulo the remaining length to pick a swap target
                const j = randomBuffer[i] % (i + 1);
                
                // Swap elements
                [fateDeck[i], fateDeck[j]] = [fateDeck[j], fateDeck[i]];
            }

            // 3. Pick the top card
            const winnerKey = fateDeck[0]; 
            const winnerIsA = (winnerKey === 'A');

            if (winnerIsA) {
                scoreA++;
                resultText.innerText = `${scenarioA} WINS`;
            } else {
                scoreB++;
                resultText.innerText = `${scenarioB} WINS`;
            }

            updateScoreboard();

            // Check win condition
            if (scoreA >= targetScore || scoreB >= targetScore) {
                // Determine who won the SERIES
                const seriesWinner = (scoreA > scoreB) ? scenarioA : scenarioB;
                endSeries(seriesWinner);
            } else {
                // Continue Game
                nextRoundBtn.disabled = false;
                nextRoundBtn.style.opacity = "1";
                nextRoundBtn.innerText = "NEXT ROUND";
            }
        }

        function updateScoreboard() {
            scoreDisplayA.innerText = scoreA;
            scoreDisplayB.innerText = scoreB;
        }

        function endSeries(winnerName) {
            gameActive = false;
            nextRoundBtn.classList.add('hidden'); 
            
            resultText.innerText = `${winnerName} IS THE CHAMPION`;
            resultBox.classList.add('winner-announce'); // Blinking effect

            // Show "Go Again" button
            goAgainBtn.style.display = 'block';

            // If we are in "Sudden Death" (Target 1), allow extension
            if (targetScore === 1) {
                seriesOptions.classList.remove('hidden');
            }
        }

        function extendSeries(newTarget) {
            const winsNeeded = Math.ceil(newTarget / 2);
            targetScore = winsNeeded;
            modeBadge.innerText = `BEST OF ${newTarget}`;
            
            // Reset UI for continuation
            gameActive = true;
            resultBox.classList.remove('winner-announce');
            resultText.innerText = "SERIES EXTENDED";
            
            nextRoundBtn.classList.remove('hidden');
            nextRoundBtn.disabled = false;
            nextRoundBtn.style.opacity = "1";
            nextRoundBtn.innerText = "CALCULATE FATE";
            
            seriesOptions.classList.add('hidden');
            
            // Edge case check
            if (scoreA >= targetScore || scoreB >= targetScore) {
                 endSeries(scoreA > scoreB ? scenarioA : scenarioB);
            }
        }

        function restartSeries() {
            // Reset scores but keep player names and target score
            scoreA = 0;
            scoreB = 0;
            
            // Update scoreboard UI
            updateScoreboard();
            
            // Reset result text and remove blinking effect
            resultText.innerText = "READY";
            resultBox.classList.remove('winner-announce');
            
            // Hide "Go Again" button
            goAgainBtn.style.display = 'none';
            
            // Hide series options if visible
            seriesOptions.classList.add('hidden');
            
            // Re-enable game controls
            gameActive = true;
            nextRoundBtn.classList.remove('hidden');
            nextRoundBtn.disabled = false;
            nextRoundBtn.style.opacity = "1";
            nextRoundBtn.innerText = "CALCULATE FATE";
        }

        function resetGame() {
            // Reset Vars
            scoreA = 0;
            scoreB = 0;
            targetScore = 1;
            gameActive = false;
            
            // Reset UI
            inputA.value = "";
            inputB.value = "";
            scoreDisplayA.innerText = "0";
            scoreDisplayB.innerText = "0";
            resultText.innerText = "READY";
            resultBox.classList.remove('winner-announce');
            
            modeBadge.innerText = "SUDDEN DEATH";
            
            gameArea.style.display = 'none';
            setupScreen.classList.remove('hidden');
            
            nextRoundBtn.classList.remove('hidden');
            nextRoundBtn.disabled = false;
            nextRoundBtn.style.opacity = "1";
            nextRoundBtn.innerText = "CALCULATE FATE";
            
            seriesOptions.classList.add('hidden');
            goAgainBtn.style.display = 'none';
        }
    </script>
</body>
</html>
