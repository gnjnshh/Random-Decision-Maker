<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Fate Generator</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --border: 4px solid #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            border: var(--border);
            padding: 40px;
            position: relative;
            background: white;
            box-shadow: 12px 12px 0px #000000;
            transition: all 0.3s ease;
        }

        h1 {
            text-transform: uppercase;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: var(--border);
            padding-bottom: 15px;
            font-size: 1.8rem;
            letter-spacing: -2px;
            line-height: 1.2;
        }

        /* Input Section */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: var(--border);
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            background: transparent;
            color: var(--fg);
            border-radius: 0;
            -webkit-appearance: none;
        }

        input:focus {
            background: #eeeeee;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 18px;
            background: var(--fg);
            color: var(--bg);
            border: 4px solid #000;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            letter-spacing: 1px;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--fg);
            border: var(--border);
        }
        
        .btn-outline:hover {
            background: #000;
            color: #fff;
        }

        /* Game Area */
        #gameArea {
            display: none;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .score-name {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .score-num {
            font-size: 3rem;
            font-weight: 900;
        }

        .vs-text {
            font-style: italic;
            font-weight: bold;
            font-size: 1.5rem;
        }

        /* Total Counter */
        .total-tally {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            padding: 5px;
            background: #eee;
            display: inline-block;
            border: 2px solid #000;
        }

        .result-display {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px dashed #000;
            padding: 10px;
        }

        #resultText {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .winner-anim {
            animation: blink 0.3s step-end 3 alternate;
        }

        @keyframes blink {
            0% { background-color: white; color: black; }
            100% { background-color: black; color: white; }
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        .entropy-status {
            font-size: 0.6rem;
            text-align: right;
            margin-top: 5px;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Decision Engine</h1>

        <!-- Setup Screen -->
        <div id="setupScreen">
            <div class="input-group">
                <label>Option A</label>
                <input type="text" id="inputA" placeholder="" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Option B</label>
                <input type="text" id="inputB" placeholder="" autocomplete="off">
            </div>
            <button class="btn" onclick="initializeGame()">INITIATE SEQUENCE</button>
        </div>

        <!-- Game Screen -->
        <div id="gameArea">
            <div class="scoreboard">
                <div class="score-box">
                    <span class="score-name" id="nameDisplayA">A</span>
                    <span class="score-num" id="scoreDisplayA">0</span>
                </div>
                <div class="vs-text">VS</div>
                <div class="score-box">
                    <span class="score-name" id="nameDisplayB">B</span>
                    <span class="score-num" id="scoreDisplayB">0</span>
                </div>
            </div>

            <div class="total-tally">
                TOTAL TRIALS: <span id="totalRoundsDisplay">0</span>
            </div>

            <div class="result-display" id="resultBox">
                <p id="resultText">READY</p>
            </div>
            
            <div class="entropy-status">ALGO: CRYPTO_SHUFFLE_256</div>

            <!-- Main Action Button -->
            <button class="btn" id="actionBtn" onclick="playRound()">CALCULATE FATE</button>
            
            <button class="btn btn-outline" style="margin-top: 30px; border-width: 2px; font-size: 0.8rem; padding: 10px;" onclick="resetGame()">RESET SYSTEM</button>
        </div>
    </div>

    <script>
        // State Variables
        let scenarioA = "";
        let scenarioB = "";
        let scoreA = 0;
        let scoreB = 0;
        let totalRounds = 0;
        let isAnimating = false;

        // DOM Elements
        const setupScreen = document.getElementById('setupScreen');
        const gameArea = document.getElementById('gameArea');
        const inputA = document.getElementById('inputA');
        const inputB = document.getElementById('inputB');
        
        const nameDisplayA = document.getElementById('nameDisplayA');
        const nameDisplayB = document.getElementById('nameDisplayB');
        const scoreDisplayA = document.getElementById('scoreDisplayA');
        const scoreDisplayB = document.getElementById('scoreDisplayB');
        const totalRoundsDisplay = document.getElementById('totalRoundsDisplay');
        
        const resultText = document.getElementById('resultText');
        const resultBox = document.getElementById('resultBox');
        const actionBtn = document.getElementById('actionBtn');

        function initializeGame() {
            if (!inputA.value.trim() || !inputB.value.trim()) {
                inputA.placeholder = "REQUIRED";
                inputB.placeholder = "REQUIRED";
                return;
            }

            scenarioA = inputA.value.toUpperCase();
            scenarioB = inputB.value.toUpperCase();
            
            // UI Transition
            setupScreen.classList.add('hidden');
            gameArea.style.display = 'block';
            
            nameDisplayA.innerText = scenarioA;
            nameDisplayB.innerText = scenarioB;
            
            // Start the first round immediately
            playRound();
        }

        function playRound() {
            if (isAnimating) return;
            isAnimating = true;

            // Visual Setup
            actionBtn.disabled = true;
            actionBtn.style.opacity = "0.8";
            actionBtn.innerText = "CALCULATING...";
            resultBox.classList.remove('winner-anim');
            
            let iterations = 0;
            let maxIterations = 10; // Short animation for snappy feel
            let speed = 40;
            
            // Flicker Animation
            const interval = setInterval(() => {
                // Toggle text purely for visual effect
                resultText.innerText = Math.random() > 0.5 ? scenarioA : scenarioB;
                iterations++;

                if (iterations >= maxIterations) { 
                    clearInterval(interval);
                    determineWinner();
                }
            }, speed);
        }

        /**
         * Cryptographically Secure Random Selection
         */
        function determineWinner() {
            // Fisher-Yates Shuffle Logic
            const poolSize = 100;
            const randomBuffer = new Uint32Array(1);
            window.crypto.getRandomValues(randomBuffer);
            
            // Simple robust modulo to determine winner (Evens = A, Odds = B)
            // Since we are using a cryptographically secure random number,
            // taking modulo 2 is statistically sound for a 50/50 split.
            const rawRandom = randomBuffer[0];
            const winnerIsA = (rawRandom % 2 === 0);

            if (winnerIsA) {
                scoreA++;
                resultText.innerText = `${scenarioA} WINS`;
            } else {
                scoreB++;
                resultText.innerText = `${scenarioB} WINS`;
            }
            
            totalRounds++;
            updateScoreboard();
            
            // Finalize Round
            resultBox.classList.add('winner-anim'); // Blink effect
            
            // Reset Button for next try
            isAnimating = false;
            actionBtn.disabled = false;
            actionBtn.style.opacity = "1";
            actionBtn.innerText = "TRY AGAIN";
        }

        function updateScoreboard() {
            scoreDisplayA.innerText = scoreA;
            scoreDisplayB.innerText = scoreB;
            totalRoundsDisplay.innerText = totalRounds;
        }

        function resetGame() {
            scoreA = 0;
            scoreB = 0;
            totalRounds = 0;
            isAnimating = false;
            
            inputA.value = "";
            inputB.value = "";
            
            scoreDisplayA.innerText = "0";
            scoreDisplayB.innerText = "0";
            totalRoundsDisplay.innerText = "0";
            resultText.innerText = "READY";
            resultBox.classList.remove('winner-anim');
            
            gameArea.style.display = 'none';
            setupScreen.classList.remove('hidden');
            
            actionBtn.innerText = "CALCULATE FATE";
            actionBtn.disabled = false;
        }
    </script>
</body>
</html>
